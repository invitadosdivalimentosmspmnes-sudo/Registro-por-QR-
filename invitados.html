<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invitados · D.C.A.A Presentismo QR</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="responsive.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
</head>
<body>

<main class="main">
  <a class="back-link" href="index.html"><i data-lucide="arrow-left"></i>Volver al dashboard</a>
  <div class="page-header">
    <div>
      <h1>Invitados</h1>
      <p>Pasantes, visitantes y colaboradores temporales sin cuenta ni contraseña.</p>
    </div>
    <button class="btn btn--primary" id="btnNuevoInvitado"><i data-lucide="user-plus"></i>Registrar invitado</button>
  </div>

  <div class="filtros-bar">
    <div class="field" style="min-width:260px">
      <label>Buscar por nombre</label>
      <input type="text" id="inputBusqueda" placeholder="Ej: Pérez, Juan…">
    </div>
  </div>

  <div id="listaInvitados">Cargando…</div>
</main>

<div id="modalForm"></div>
<div id="modalHistorial"></div>
<div id="modalQr"></div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
<script src="qr.js"></script>
<script>

let invitados = [];

async function cargar() {
  const cont = document.getElementById('listaInvitados');
  cont.innerHTML = elCarga();
  try {
    invitados = await Api.getInvitados();
    render(invitados);
  } catch (err) {
    cont.innerHTML = elError(mensajeErrorApi(err));
  }
}

function render(lista) {
  const cont = document.getElementById('listaInvitados');
  if (lista.length === 0) {
    cont.innerHTML = elVacio('Todavía no hay invitados registrados', 'Usá "Registrar invitado" para dar de alta a un pasante o visitante.', 'user-plus');
    refrescarIconos();
    return;
  }
  cont.innerHTML = '<div class="persona-grid">' + lista.map(function (inv) {
    const iniciales = (inv.APELLIDO || '').charAt(0) + (inv.NOMBRES || '').charAt(0);
    const inactivo = String(inv.ESTADO).toUpperCase() === 'INACTIVO';
    return '<div class="persona-card">' +
      '<div style="display:flex; justify-content:space-between; align-items:flex-start;">' +
        '<div class="persona-card__avatar">' + escapeHtml(iniciales.toUpperCase()) + '</div>' +
        '<span class="badge badge--' + (inactivo ? 'gris' : 'verde') + '">' + (inactivo ? 'Inactivo' : 'Activo') + '</span>' +
      '</div>' +
      '<div class="persona-card__nombre">' + escapeHtml(inv.NOMBRE_COMPLETO) + '</div>' +
      '<div class="persona-card__id">' + escapeHtml(inv.ID_INVITADO) + '</div>' +
      '<div class="persona-card__meta">' + escapeHtml(inv.TIPO || 'Visitante') + ' · DNI ' + enmascararDni(inv.DNI) + '</div>' +
      '<div style="display:flex; gap:6px; margin-top:12px; flex-wrap:wrap;">' +
        '<button class="btn btn--secondary" style="flex:1; padding:7px; font-size:12px" data-hist="' + escapeHtml(inv.ID_INVITADO) + '">Historial</button>' +
        '<button class="btn btn--ghost" style="flex:1; padding:7px; font-size:12px" data-qr="' + escapeHtml(inv.ID_INVITADO) + '">Ver QR</button>' +
        '<button class="btn btn--ghost" style="flex:1; padding:7px; font-size:12px" data-editar="' + escapeHtml(inv.ID_INVITADO) + '">Editar</button>' +
      '</div>' +
    '</div>';
  }).join('') + '</div>';

  document.querySelectorAll('[data-hist]').forEach(function (btn) {
    btn.addEventListener('click', function () { abrirHistorial(btn.getAttribute('data-hist')); });
  });
  document.querySelectorAll('[data-qr]').forEach(function (btn) {
    btn.addEventListener('click', function () { abrirQr(btn.getAttribute('data-qr')); });
  });
  document.querySelectorAll('[data-editar]').forEach(function (btn) {
    btn.addEventListener('click', function () { abrirFormInvitado(btn.getAttribute('data-editar')); });
  });
}

document.getElementById('inputBusqueda').addEventListener('input', function (e) {
  const q = e.target.value.toLowerCase();
  render(invitados.filter(function (i) { return String(i.NOMBRE_COMPLETO).toLowerCase().indexOf(q) !== -1; }));
});

/* ---------- Alta / edición ---------- */

document.getElementById('btnNuevoInvitado').addEventListener('click', function () { abrirFormInvitado(null); });

function abrirFormInvitado(idInvitado) {
  const esEdicion = !!idInvitado;
  const inv = esEdicion ? invitados.find(function (i) { return i.ID_INVITADO === idInvitado; }) : null;
  const modal = document.getElementById('modalForm');
  const tipos = ['Pasante', 'Visitante', 'Colaborador', 'Otro'];

  modal.innerHTML =
    '<div class="overlay" id="overlayForm"><div class="modal">' +
      '<h3>' + (esEdicion ? 'Editar invitado' : 'Registrar invitado') + '</h3>' +
      '<p>' + (esEdicion ? escapeHtml(inv.ID_INVITADO) : 'No se crea cuenta ni contraseña. Se generará un QR único para esta persona.') + '</p>' +
      '<div id="errorForm"></div>' +
      '<div class="form-row">' +
        '<div class="field"><label>Apellido *</label><input type="text" id="fApellido" value="' + escapeHtml(esEdicion ? inv.APELLIDO : '') + '"></div>' +
        '<div class="field"><label>Nombres *</label><input type="text" id="fNombres" value="' + escapeHtml(esEdicion ? inv.NOMBRES : '') + '"></div>' +
      '</div>' +
      '<div class="field"><label>DNI *</label><input type="text" id="fDni" inputmode="numeric" value="' + escapeHtml(esEdicion ? inv.DNI : '') + '"></div>' +
      '<div class="form-row">' +
        '<div class="field"><label>Tipo de visitante</label><select id="fTipo">' +
          tipos.map(function (t) { return '<option' + (esEdicion && inv.TIPO === t ? ' selected' : '') + '>' + t + '</option>'; }).join('') +
        '</select></div>' +
        '<div class="field"><label>Área / Sector</label><input type="text" id="fSector" value="' + escapeHtml(esEdicion ? inv.SECTOR : '') + '"></div>' +
      '</div>' +
      (esEdicion ? '<div class="field"><label>Estado</label><select id="fEstado">' +
        '<option value="ACTIVO"' + (inv.ESTADO === 'ACTIVO' ? ' selected' : '') + '>Activo</option>' +
        '<option value="INACTIVO"' + (String(inv.ESTADO).toUpperCase() === 'INACTIVO' ? ' selected' : '') + '>Inactivo</option>' +
        '</select></div>' : '') +
      '<div class="field"><label>Observación</label><textarea id="fObservacion" rows="2">' + escapeHtml(esEdicion ? inv.OBSERVACION : '') + '</textarea></div>' +
      '<div class="modal__actions">' +
        '<button class="btn btn--secondary" id="btnCancelarForm">Cancelar</button>' +
        '<button class="btn btn--primary" id="btnGuardarForm">' + (esEdicion ? 'Guardar cambios' : 'Generar QR') + '</button>' +
      '</div>' +
    '</div></div>';

  document.getElementById('btnCancelarForm').addEventListener('click', function () { modal.innerHTML = ''; });
  document.getElementById('overlayForm').addEventListener('click', function (e) { if (e.target.id === 'overlayForm') modal.innerHTML = ''; });
  document.getElementById('btnGuardarForm').addEventListener('click', function () { guardarInvitado(esEdicion, idInvitado); });
}

async function guardarInvitado(esEdicion, idInvitado) {
  const apellido = document.getElementById('fApellido').value.trim();
  const nombres = document.getElementById('fNombres').value.trim();
  const dni = document.getElementById('fDni').value.trim();
  const tipo = document.getElementById('fTipo').value;
  const sector = document.getElementById('fSector').value.trim();
  const observacion = document.getElementById('fObservacion').value.trim();
  const estado = esEdicion ? document.getElementById('fEstado').value : 'ACTIVO';
  const errorBox = document.getElementById('errorForm');

  if (!apellido || !nombres || !dni) {
    errorBox.innerHTML = elError('Apellido, nombres y DNI son obligatorios.');
    refrescarIconos();
    return;
  }

  const btn = document.getElementById('btnGuardarForm');
  btn.disabled = true;
  btn.textContent = 'Guardando…';

  try {
    const payload = { apellido: apellido, nombres: nombres, dni: dni, tipo: tipo, sector: sector, observacion: observacion, estado: estado };
    const res = esEdicion
      ? await Api.actualizarInvitado(Object.assign({ id_invitado: idInvitado }, payload))
      : await Api.crearInvitado(payload);

    if (!res.ok) {
      errorBox.innerHTML = elError(res.error || 'No se pudo guardar el invitado.');
      refrescarIconos();
      btn.disabled = false;
      btn.textContent = esEdicion ? 'Guardar cambios' : 'Generar QR';
      return;
    }

    document.getElementById('modalForm').innerHTML = '';
    if (esEdicion) {
      const idx = invitados.findIndex(function (i) { return i.ID_INVITADO === idInvitado; });
      invitados[idx] = res.invitado;
      render(invitados);
    } else {
      invitados.push(res.invitado);
      render(invitados);
      mostrarQrInvitado(res.invitado);
    }
  } catch (err) {
    errorBox.innerHTML = elError(mensajeErrorApi(err));
    refrescarIconos();
    btn.disabled = false;
    btn.textContent = esEdicion ? 'Guardar cambios' : 'Generar QR';
  }
}

function mostrarQrInvitado(inv) {
  const modal = document.getElementById('modalQr');
  modal.innerHTML =
    '<div class="overlay" id="overlayQrNuevo"><div class="modal" style="text-align:center">' +
      '<h3>' + escapeHtml(inv.NOMBRE_COMPLETO) + '</h3>' +
      '<canvas id="canvasQrNuevo" style="margin:10px auto"></canvas>' +
      '<p class="dni-mono">' + escapeHtml(inv.QR_ID) + '</p>' +
      '<div class="modal__actions">' +
        '<button class="btn btn--secondary" id="btnCerrarQrNuevo">Cerrar</button>' +
        '<button class="btn btn--primary" id="btnDescargarQrNuevo">Descargar QR</button>' +
      '</div>' +
    '</div></div>';
  dibujarQr(document.getElementById('canvasQrNuevo'), inv.QR_ID);
  document.getElementById('btnCerrarQrNuevo').addEventListener('click', function () { modal.innerHTML = ''; });
  document.getElementById('btnDescargarQrNuevo').addEventListener('click', async function () {
    const dataUrl = await qrComoDataUrl(inv.QR_ID);
    descargarDataUrl(dataUrl, inv.QR_ID + '.png');
  });
}

async function abrirQr(idInvitado) {
  const inv = invitados.find(function (i) { return i.ID_INVITADO === idInvitado; });
  if (!inv) return;
  mostrarQrInvitado(inv);
}

/* ---------- Historial ---------- */

async function abrirHistorial(idPersona) {
  const modal = document.getElementById('modalHistorial');
  modal.innerHTML =
    '<div class="overlay" id="overlayHist"><div class="modal" style="max-width:560px; max-height:80vh; overflow:auto;">' +
      '<div id="histContenido">' + elCarga('Cargando historial…') + '</div>' +
      '<div class="modal__actions"><button class="btn btn--secondary btn--full" id="btnCerrarHist">Cerrar</button></div>' +
    '</div></div>';
  refrescarIconos();
  document.getElementById('btnCerrarHist').addEventListener('click', function () { modal.innerHTML = ''; });
  document.getElementById('overlayHist').addEventListener('click', function (e) { if (e.target.id === 'overlayHist') modal.innerHTML = ''; });

  try {
    const registros = await Api.getRegistros({ persona_id: idPersona });
    const persona = invitados.find(function (i) { return i.ID_INVITADO === idPersona; });

    const resumen = {};
    TIPOS_REGISTRO.forEach(function (t) { resumen[t.valor] = 0; });
    registros.forEach(function (r) { if (resumen.hasOwnProperty(r.TIPO_REGISTRO)) resumen[r.TIPO_REGISTRO]++; });

    const resumenHtml = TIPOS_REGISTRO.map(function (t) {
      return '<div class="stat-card" style="padding:10px 12px;"><div class="stat-card__label">' + t.etiqueta + '</div><div class="stat-card__num" style="font-size:19px">' + resumen[t.valor] + '</div></div>';
    }).join('');

    const filasHtml = registros.length
      ? registros.slice(0, 30).map(function (r) {
          return '<tr><td>' + formatFechaCorta(r.FECHA) + '</td><td>' + escapeHtml(r.HORA) + '</td><td>' + badgeTipoRegistro(r.TIPO_REGISTRO) + '</td><td>' + escapeHtml(r.OBSERVACION || '—') + '</td></tr>';
        }).join('')
      : '<tr><td colspan="4" style="text-align:center; color:var(--color-gris-oscuro)">Sin registros todavía</td></tr>';

    document.getElementById('histContenido').innerHTML =
      '<h3>' + escapeHtml(persona ? persona.NOMBRE_COMPLETO : idPersona) + '</h3>' +
      '<p class="dni-mono">' + escapeHtml(idPersona) + '</p>' +
      '<div class="stat-grid" style="grid-template-columns:repeat(4,1fr); margin:14px 0;">' + resumenHtml + '</div>' +
      '<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Hora</th><th>Tipo</th><th>Observación</th></tr></thead><tbody>' + filasHtml + '</tbody></table></div>';
    refrescarIconos();
  } catch (err) {
    document.getElementById('histContenido').innerHTML = elError(mensajeErrorApi(err));
    refrescarIconos();
  }
}

cargar();
</script>
</body>
</html>
